name: Cloudflare Pages に配信

# main に push されたとき（と、手動実行）だけ動く。fork や PR からは動かない。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  # 配信の前に tests/ のテストをすべて実行する。1本でも失敗したら、次の配信は動かない。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: テストをすべて実行する
        run: |
          failed=0
          for f in tests/*.cjs; do
            echo "== $f"
            node "$f" || { echo "::error::テストが失敗しました: $f"; failed=1; }
          done
          exit $failed

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 配信するファイルだけを集める
        run: |
          mkdir _site
          # 開発用のファイル（作業ルール・テスト・DBの控え）は配信しない
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='CLAUDE.md' --exclude='AGENTS.md' --exclude='tests' --exclude='supabase' --exclude='.gitignore' --exclude='_site' ./ _site/
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=rekishi-log --branch=main
